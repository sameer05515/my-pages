<!DOCTYPE html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Irregular Verbs Explorer</title>
    <meta
      name="description"
      content="Explore an interactive table of English irregular verbs with Alpine.js filters, Tailwind CSS styling, and quick searches for ESL learners."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
            },
            colors: {
              "slate-950": "#020617",
            },
            boxShadow: {
              glow: "0 0 35px rgba(14, 165, 233, 0.25)",
            },
          },
        },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>
      body {
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: rgba(148, 163, 184, 0.45);
        border-radius: 9999px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div class="relative min-h-screen overflow-x-hidden bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">
      <div class="absolute inset-x-0 top-0 -z-10 h-64 bg-gradient-to-b from-sky-500/20 via-transparent to-transparent blur-3xl"></div>
      <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
        <div x-data="irregularVerbsApp()" x-init="init()" class="relative space-y-12">
          <header class="space-y-6 text-center">
            <p class="inline-flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/70 px-4 py-1 text-xs font-medium uppercase tracking-[0.3em] text-slate-300">
              Updated resource
            </p>
            <h1 class="text-3xl font-semibold tracking-tight text-white sm:text-4xl md:text-5xl">Irregular Verbs Explorer</h1>
            <p class="mx-auto max-w-3xl text-base text-slate-300 sm:text-lg">
              Search 470+ English irregular verbs, compare their simple past and past participle forms, and focus on tricky variants with an
              interactive filtering experience.
            </p>
            <div class="flex flex-wrap items-center justify-center gap-3 text-sm text-slate-400">
              <div class="flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/70 px-4 py-2">
                <span class="inline-flex h-2.5 w-2.5 rounded-full bg-sky-400"></span>
                <span x-text="`${totalVerbs} verbs indexed`"></span>
              </div>
              <div class="flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/70 px-4 py-2">
                <span class="inline-flex h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
                <span x-text="`${letters.length} letter groups`"></span>
              </div>
              <div class="flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/70 px-4 py-2">
                <span class="inline-flex h-2.5 w-2.5 rounded-full bg-orange-400"></span>
                <span x-text="`${variantOptions.length} variant filters`"></span>
              </div>
            </div>
          </header>

          <section class="rounded-3xl border border-slate-800/80 bg-slate-900/70 shadow-lg shadow-sky-900/15 backdrop-blur-sm">
            <div class="grid gap-8 p-6 md:p-8 lg:grid-cols-[2fr,1fr]">
              <div class="space-y-6">
                <label class="block text-sm font-medium text-slate-300">
                  Search the list
                  <div class="relative mt-2">
                    <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-500">
                      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                      </svg>
                    </span>
                    <input
                      x-model.debounce.250ms="query"
                      type="search"
                      placeholder="Search verbs or forms, e.g. drink / drank / drunk"
                      class="w-full rounded-2xl border border-slate-700/70 bg-slate-900/90 py-3 pl-11 pr-4 text-base text-slate-100 placeholder:text-slate-500 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/40"
                    />
                  </div>
                </label>

                <div class="grid gap-4 sm:grid-cols-2">
                  <label class="block text-sm font-medium text-slate-300">
                    Variant filter
                    <select
                      x-model="variantFilter"
                      class="mt-2 w-full rounded-2xl border border-slate-700/70 bg-slate-900/90 px-4 py-3 text-sm text-slate-100 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/40"
                    >
                      <template x-for="option in variantOptions" :key="option.value">
                        <option :value="option.value" x-text="option.label"></option>
                      </template>
                    </select>
                  </label>

                  <div class="block text-sm font-medium text-slate-300">
                    Sort order
                    <div class="mt-2 grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        @click="setSort('alpha')"
                        :class="sort === 'alpha' ? 'bg-sky-500 text-white shadow-glow' : 'bg-slate-900/90 text-slate-300 hover:bg-slate-800/80'"
                        class="rounded-2xl border border-slate-700/70 px-4 py-3 text-sm font-medium transition"
                      >
                        A → Z
                      </button>
                      <button
                        type="button"
                        @click="setSort('variants')"
                        :class="sort === 'variants' ? 'bg-sky-500 text-white shadow-glow' : 'bg-slate-900/90 text-slate-300 hover:bg-slate-800/80'"
                        class="rounded-2xl border border-slate-700/70 px-4 py-3 text-sm font-medium transition"
                      >
                        Most variants
                      </button>
                    </div>
                  </div>
                </div>

                <div class="space-y-3">
                  <span class="block text-sm font-medium text-slate-300">Quick jump</span>
                  <div class="flex flex-wrap gap-1.5">
                    <button
                      type="button"
                      @click="setLetter('all')"
                      :class="letter === 'all' ? 'bg-sky-500 text-white shadow-glow' : 'bg-slate-900/90 text-slate-200 hover:bg-slate-800/80'"
                      class="rounded-full border border-slate-700/70 px-3 py-1 text-xs font-semibold uppercase tracking-wide transition"
                    >
                      All
                    </button>
                    <template x-for="char in letters" :key="`jump-${char}`">
                      <button
                        type="button"
                        @click="setLetter(char); ensureLetterVisible(char)"
                        :disabled="!availableLetters.has(char)"
                        :class="letterButtonClass(char)"
                        class="rounded-full border border-slate-700/70 px-3 py-1 text-xs font-semibold uppercase tracking-wide transition"
                      >
                        <span x-text="char"></span>
                      </button>
                    </template>
                    <template x-if="availableLetters.has('#')">
                      <button
                        type="button"
                        @click="setLetter('#'); ensureLetterVisible('#')"
                        :class="letterButtonClass('#')"
                        class="rounded-full border border-slate-700/70 px-3 py-1 text-xs font-semibold uppercase tracking-wide transition"
                      >
                        Symbols
                      </button>
                    </template>
                  </div>
                </div>

                <div class="grid gap-3 sm:grid-cols-2">
                  <button
                    type="button"
                    @click="setView('table')"
                    :class="viewMode === 'table' ? 'bg-sky-500 text-white shadow-glow' : 'bg-slate-900/90 text-slate-200 hover:bg-slate-800/80'"
                    class="inline-flex items-center justify-center gap-2 rounded-2xl border border-slate-700/70 px-4 py-3 text-sm font-medium transition"
                  >
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h18M3 12h18M3 19h18" />
                    </svg>
                    Table view
                  </button>
                  <button
                    type="button"
                    @click="setView('cards')"
                    :class="viewMode === 'cards' ? 'bg-sky-500 text-white shadow-glow' : 'bg-slate-900/90 text-slate-200 hover:bg-slate-800/80'"
                    class="inline-flex items-center justify-center gap-2 rounded-2xl border border-slate-700/70 px-4 py-3 text-sm font-medium transition"
                  >
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h7V4H4v2Zm9 0h7V4h-7v2ZM4 13h7v-2H4v2Zm9 0h7v-2h-7v2ZM4 20h7v-2H4v2Zm9 0h7v-2h-7v2Z" />
                    </svg>
                    Card view
                  </button>
                </div>
              </div>

              <div class="flex flex-col justify-between gap-6 rounded-2xl border border-slate-800/80 bg-slate-950/80 p-6 shadow-lg shadow-black/25">
                <div>
                  <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Snapshot</h2>
                  <dl class="mt-4 space-y-3 text-sm text-slate-300">
                    <div class="flex items-center justify-between rounded-xl border border-slate-800/70 bg-slate-900/80 px-4 py-3">
                      <dt>Results</dt>
                      <dd class="font-semibold text-white" x-text="filtered.length"></dd>
                    </div>
                    <div class="flex items-center justify-between rounded-xl border border-slate-800/70 bg-slate-900/80 px-4 py-3">
                      <dt>Current letter</dt>
                      <dd class="font-semibold text-white" x-text="letter === 'all' ? 'All letters' : letter"></dd>
                    </div>
                    <div class="flex items-center justify-between rounded-xl border border-slate-800/70 bg-slate-900/80 px-4 py-3">
                      <dt>Active filter</dt>
                      <dd class="font-semibold text-white" x-text="activeVariantLabel()"></dd>
                    </div>
                    <div class="flex items-center justify-between rounded-xl border border-slate-800/70 bg-slate-900/80 px-4 py-3">
                      <dt>Layout</dt>
                      <dd class="font-semibold text-white" x-text="viewMode === 'table' ? 'Table view' : 'Card view'"></dd>
                    </div>
                  </dl>
                </div>
                <button
                  type="button"
                  @click="resetFilters()"
                  class="inline-flex items-center justify-center gap-2 rounded-2xl border border-slate-700/70 bg-slate-900/80 px-4 py-2 text-sm font-medium text-slate-200 transition hover:border-sky-400 hover:text-white hover:shadow-glow"
                >
                  Reset filters
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4 4 5 5m0-5L4 9" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="m20 20-5-5m5 0-5 5" />
                  </svg>
                </button>
              </div>
            </div>
          </section>

          <section class="relative space-y-6">
            <template x-if="loading">
              <div class="rounded-3xl border border-slate-800/80 bg-slate-900/60 p-10 text-center shadow-lg shadow-black/25">
                <div class="mx-auto flex h-12 w-12 animate-spin items-center justify-center rounded-full border-2 border-slate-700 border-t-sky-400"></div>
                <p class="mt-6 text-sm text-slate-400">Loading irregular verbs…</p>
              </div>
            </template>

            <template x-if="error">
              <div class="rounded-3xl border border-rose-900/60 bg-rose-950/50 p-8 text-center text-rose-200 shadow-lg shadow-rose-900/20">
                <h2 class="text-lg font-semibold text-rose-100">Unable to load data</h2>
                <p class="mt-3 text-sm">Please make sure the JSON file is available and try again.</p>
                <button
                  type="button"
                  @click="retry()"
                  class="mt-6 inline-flex items-center gap-2 rounded-full border border-rose-500/50 bg-rose-500/20 px-5 py-2 text-sm font-medium text-rose-100 transition hover:bg-rose-500/30"
                >
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M19.071 19.071a9 9 0 1 0-14.142 0" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v3m0 0 1.5-1.5M12 18l-1.5-1.5" />
                  </svg>
                  Try again
                </button>
              </div>
            </template>

            <template x-if="!loading && !error && filtered.length === 0">
              <div class="rounded-3xl border border-slate-800/80 bg-slate-900/60 p-10 text-center shadow-lg shadow-black/25">
                <h2 class="text-lg font-semibold text-white">No matches found</h2>
                <p class="mt-3 text-sm text-slate-400">Adjust your search phrase or filters to see more verbs.</p>
              </div>
            </template>

            <template x-if="!loading && !error && filtered.length > 0">
              <div class="space-y-6">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                  <p class="text-sm text-slate-400">
                    Showing
                    <span class="font-semibold text-slate-200" x-text="visibleVerbs.length"></span>
                    of
                    <span class="font-semibold text-slate-200" x-text="filtered.length"></span>
                    matching verbs
                  </p>
                  <div class="flex items-center gap-2 text-xs text-slate-500">
                    <span class="inline-flex h-2.5 w-2.5 rounded-full bg-sky-400"></span>
                    <span>Click a card or row to copy the verb family.</span>
                  </div>
                </div>

                <template x-if="viewMode === 'cards'">
                  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                    <template x-for="verb in visibleVerbs" :key="verb.id">
                      <article
                        @click="copyVerb(verb)"
                        :data-letter-anchor="verb.isFirstOfLetter ? verb.letter : null"
                        class="group relative flex cursor-pointer flex-col gap-4 rounded-3xl border border-slate-800/80 bg-slate-900/80 p-6 shadow-lg shadow-black/25 transition hover:border-sky-400/70 hover:bg-slate-900 hover:shadow-glow"
                      >
                        <div class="flex items-start justify-between gap-3">
                          <div>
                            <h3 class="text-xl font-semibold text-white transition group-hover:text-sky-300" x-text="verb.base"></h3>
                            <p class="mt-1 text-xs uppercase tracking-wide text-slate-400" x-text="variantBadge(verb)"></p>
                          </div>
                          <span class="rounded-full border border-emerald-500/40 bg-emerald-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-emerald-200">
                            <span x-text="verb.variantLabel"></span>
                          </span>
                        </div>
                        <div class="space-y-3 text-sm text-slate-300">
                          <div>
                            <span class="block text-xs font-medium uppercase tracking-wide text-slate-400">Simple past</span>
                            <ul class="mt-1 space-y-1 text-slate-200">
                              <template x-for="(form, idx) in verb.simplePastForms" :key="`${verb.id}-past-${idx}`">
                                <li class="leading-relaxed" x-text="form"></li>
                              </template>
                            </ul>
                          </div>
                          <div>
                            <span class="block text-xs font-medium uppercase tracking-wide text-slate-400">Past participle</span>
                            <ul class="mt-1 space-y-1 text-slate-200">
                              <template x-for="(form, idx) in verb.pastParticipleForms" :key="`${verb.id}-part-${idx}`">
                                <li class="leading-relaxed" x-text="form"></li>
                              </template>
                            </ul>
                          </div>
                          <template x-if="verb.hasFootnote">
                            <p class="text-xs italic text-slate-500">
                              Usage note available:&nbsp;
                              <a
                                href="https://www.englishpage.com/irregularverbs/irregularverbs.html#flashcards"
                                target="_blank"
                                rel="noreferrer"
                                class="text-sky-400 underline-offset-2 hover:text-sky-300 hover:underline"
                                >see reference</a
                              >
                            </p>
                          </template>
                        </div>
                        <div class="mt-auto flex items-center justify-between text-xs text-slate-500">
                          <span>Starts with <span class="font-semibold text-slate-300" x-text="verb.letter"></span></span>
                          <span class="hidden items-center gap-1 text-slate-400 group-hover:flex">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M16 8v6a4 4 0 0 1-4 4H6" />
                              <path stroke-linecap="round" stroke-linejoin="round" d="M8 16V10a4 4 0 0 1 4-4h6" />
                            </svg>
                            <span>Copied</span>
                          </span>
                        </div>
                      </article>
                    </template>
                  </div>
                </template>

                <template x-if="viewMode === 'table'">
                  <div class="overflow-hidden rounded-3xl border border-slate-800/80 bg-slate-900/80 shadow-lg shadow-black/25">
                    <div class="scrollbar-thin overflow-x-auto">
                      <table class="min-w-full divide-y divide-slate-800 text-left text-sm text-slate-200">
                        <thead class="bg-slate-900">
                          <tr class="text-xs uppercase tracking-wide text-slate-400">
                            <th scope="col" class="px-5 py-3 font-medium">Verb (V1)</th>
                            <th scope="col" class="px-5 py-3 font-medium">Simple past (V2)</th>
                            <th scope="col" class="px-5 py-3 font-medium">Past participle (V3)</th>
                            <th scope="col" class="px-5 py-3 font-medium">Variant type</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">
                          <template x-for="verb in visibleVerbs" :key="`${verb.id}-row`">
                            <tr
                              @click="copyVerb(verb)"
                              :data-letter-anchor="verb.isFirstOfLetter ? verb.letter : null"
                              class="cursor-pointer transition hover:bg-slate-800/80"
                            >
                              <td class="whitespace-nowrap px-5 py-4 font-semibold text-white" x-text="verb.base"></td>
                              <td class="px-5 py-4">
                                <ul class="space-y-1">
                                  <template x-for="(form, idx) in verb.simplePastForms" :key="`${verb.id}-table-past-${idx}`">
                                    <li class="leading-relaxed" x-text="form"></li>
                                  </template>
                                </ul>
                              </td>
                              <td class="px-5 py-4">
                                <ul class="space-y-1">
                                  <template x-for="(form, idx) in verb.pastParticipleForms" :key="`${verb.id}-table-part-${idx}`">
                                    <li class="leading-relaxed" x-text="form"></li>
                                  </template>
                                </ul>
                              </td>
                              <td class="whitespace-nowrap px-5 py-4">
                                <span
                                  :class="verb.variantLabel === 'Multiple variants'
                                    ? 'inline-flex items-center gap-2 rounded-full border border-sky-500/40 bg-sky-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-sky-300'
                                    : verb.variantLabel === 'Changed form'
                                    ? 'inline-flex items-center gap-2 rounded-full border border-amber-500/40 bg-amber-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-amber-300'
                                    : 'inline-flex items-center gap-2 rounded-full border border-emerald-500/40 bg-emerald-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-emerald-200'"
                                >
                                  <span x-text="verb.variantLabel"></span>
                                </span>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </template>

                <div class="flex justify-center">
                  <button
                    type="button"
                    @click="loadMore()"
                    x-show="visibleVerbs.length < filtered.length"
                    class="inline-flex items-center gap-2 rounded-full border border-slate-700/70 bg-slate-900/90 px-6 py-2 text-sm font-medium text-slate-200 transition hover:border-sky-400 hover:text-white hover:shadow-glow"
                  >
                    Load more
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                  </button>
                </div>
              </div>
            </template>
          </section>
        </div>
      </div>
    </div>

    <template id="copy-toast-template">
      <div class="rounded-full border border-sky-500/40 bg-sky-500/20 px-4 py-2 text-sm font-medium text-sky-100 shadow-glow">
        Copied verb family
      </div>
    </template>

    <script>
      function irregularVerbsApp() {
        return {
          loading: true,
          error: null,
          verbs: [],
          headings: new Set(),
          query: "",
          variantFilter: "all",
          sort: "alpha",
          letter: "all",
          viewMode: "table",
          visibleCount: 72,
          totalVerbs: 0,
          letters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),
          availableLetters: new Set(),
          variantOptions: [
            { value: "all", label: "All verbs" },
            { value: "multiple", label: "Show multiple variants" },
            { value: "changed", label: "Changed form (one variant)" },
            { value: "same", label: "Same as base" },
          ],
          async init() {
            this.$watch("query", () => this.resetVisible());
            this.$watch("variantFilter", () => this.resetVisible());
            this.$watch("letter", () => this.resetVisible());
            this.$watch("sort", () => this.resetVisible(false));
            this.$watch("viewMode", () => this.resetVisible(false));
            await this.loadData();
          },
          async loadData() {
            this.loading = true;
            this.error = null;
            try {
              const response = await fetch("synthesized-data/IrregularVerb.json");
              if (!response.ok) {
                throw new Error(`Request failed with status ${response.status}`);
              }
              const raw = await response.json();
              const transformed = raw.map((item, index) => this.transformVerb(item, index)).filter(Boolean);

              const headingLetters = new Set();
              const verbs = [];
              transformed.forEach((entry) => {
                if (entry.type === "heading") {
                  headingLetters.add(entry.letter);
                } else {
                  verbs.push(entry);
                }
              });

              this.verbs = this.sortVerbs(verbs);
              this.totalVerbs = this.verbs.length;
              const letterSet = new Set([...headingLetters, ...this.verbs.map((verb) => verb.letter)]);
              this.letters = Array.from(letterSet).sort();
              this.availableLetters = new Set(this.verbs.map((verb) => verb.letter));
              this.markFirstLetters();
            } catch (err) {
              console.error("Irregular verbs load failed:", err);
              this.error = "Unable to load irregular verbs right now.";
            } finally {
              this.loading = false;
            }
          },
          retry() {
            this.loadData();
          },
          transformVerb(item, index) {
            const base = this.cleanText(item.V1Infinitive);
            const v2Raw = this.cleanText(item.V2SimplePast);
            const v3Raw = this.cleanText(item.V3PastParticiple);
            if (!base && !v2Raw && !v3Raw) return null;

            const isLetterHeading =
              base &&
              base.length === 1 &&
              /^[A-Z]$/i.test(base) &&
              v2Raw.toUpperCase() === base.toUpperCase() &&
              v3Raw.toUpperCase() === base.toUpperCase();
            if (isLetterHeading) {
              return { type: "heading", letter: base.toUpperCase() };
            }

            if (!base) return null;
            const simplePast = this.extractForms(v2Raw);
            const pastParticiple = this.extractForms(v3Raw);
            const letterMatch = base.replace(/^[^a-zA-Z]+/, "");
            const letter = letterMatch ? letterMatch[0].toUpperCase() : "#";

            const baseLower = base.toLowerCase();
            const simpleMatchesBase = simplePast.forms.length > 0 ? simplePast.forms.every((form) => form.toLowerCase() === baseLower) : false;
            const participleMatchesBase = pastParticiple.forms.length > 0 ? pastParticiple.forms.every((form) => form.toLowerCase() === baseLower) : false;
            const hasMultiple =
              simplePast.forms.length > 1 ||
              pastParticiple.forms.length > 1 ||
              simplePast.forms.some((form) => form.toLowerCase() !== baseLower) ||
              pastParticiple.forms.some((form) => form.toLowerCase() !== baseLower);

            let variantLabel = "Same as base";
            if (hasMultiple && (simplePast.forms.length > 1 || pastParticiple.forms.length > 1)) {
              variantLabel = "Multiple variants";
            } else if (!simpleMatchesBase || !participleMatchesBase) {
              variantLabel = "Changed form";
            }

            const variantCategory =
              variantLabel === "Multiple variants" ? "multiple" : variantLabel === "Changed form" ? "changed" : "same";

            return {
              id: `${base}-${index}`,
              base,
              simplePastForms: simplePast.forms,
              pastParticipleForms: pastParticiple.forms,
              letter: /^[A-Z]$/.test(letter) ? letter : "#",
              hasFootnote: simplePast.hasFootnote || pastParticiple.hasFootnote,
              variantLabel,
              variantCategory,
            };
          },
          cleanText(value) {
            return (value || "").replace(/\s+/g, " ").trim();
          },
          extractForms(value) {
            const hasFootnote = /\[\?\]/.test(value);
            const withoutNotes = value.replace(/\[\?\]/g, "").trim();
            if (!withoutNotes) {
              return { forms: [], hasFootnote };
            }
            const rawSplits = withoutNotes
              .split(/\/|,|;|\bor\b/i)
              .map((part) => part.replace(/\s+/g, " ").trim())
              .filter(Boolean);
            const uniqueForms = Array.from(new Set(rawSplits));
            return { forms: uniqueForms.length ? uniqueForms : [withoutNotes], hasFootnote };
          },
          get filtered() {
            if (!this.verbs.length) return [];
            const queryValue = this.query.trim().toLowerCase();
            const letterValue = this.letter;
            const variantValue = this.variantFilter;
            const filteredList = this.verbs.filter((verb) => {
              const matchesQuery = queryValue
                ? [verb.base, ...verb.simplePastForms, ...verb.pastParticipleForms].some((text) =>
                    text.toLowerCase().includes(queryValue)
                  )
                : true;
              const matchesLetter = letterValue === "all" ? true : verb.letter === letterValue;
              const matchesVariant =
                variantValue === "all"
                  ? true
                  : variantValue === "multiple"
                  ? verb.variantCategory === "multiple"
                  : variantValue === "changed"
                  ? verb.variantCategory === "changed"
                  : verb.variantCategory === "same";
              return matchesQuery && matchesLetter && matchesVariant;
            });
            const sorted = this.sortVerbs(filteredList);
            this.markFirstLetters(sorted);
            return sorted;
          },
          sortVerbs(list) {
            const comparator =
              this.sort === "variants"
                ? (a, b) => {
                    const variantsA = a.simplePastForms.length + a.pastParticipleForms.length;
                    const variantsB = b.simplePastForms.length + b.pastParticipleForms.length;
                    return variantsB - variantsA || a.base.localeCompare(b.base);
                  }
                : (a, b) => a.base.localeCompare(b.base);
            return [...list].sort(comparator);
          },
          get visibleVerbs() {
            return this.filtered.slice(0, this.visibleCount);
          },
          setSort(mode) {
            this.sort = mode;
          },
          setView(mode) {
            this.viewMode = mode;
          },
          setLetter(value) {
            this.letter = value;
          },
          ensureLetterVisible(letter) {
            if (letter === "all") return;
            const index = this.filtered.findIndex((verb) => verb.letter === letter);
            if (index === -1) return;
            if (index >= this.visibleCount) {
              this.visibleCount = index + 36;
            }
            this.$nextTick(() => {
              const anchor = document.querySelector(`[data-letter-anchor="${letter}"]`);
              if (anchor) {
                anchor.scrollIntoView({ behavior: "smooth", block: "start" });
              }
            });
          },
          letterButtonClass(char) {
            if (!this.availableLetters.has(char)) {
              return "cursor-not-allowed border-slate-800/60 bg-slate-900/60 text-slate-600";
            }
            return this.letter === char ? "bg-sky-500 text-white shadow-glow" : "bg-slate-900/90 text-slate-200 hover:bg-slate-800/80";
          },
          resetFilters() {
            this.query = "";
            this.variantFilter = "all";
            this.letter = "all";
            this.sort = "alpha";
            this.viewMode = "table";
            this.resetVisible();
          },
          resetVisible(resetCount = true) {
            if (resetCount) {
              this.visibleCount = this.viewMode === "table" ? 72 : 48;
            }
          },
          loadMore() {
            this.visibleCount += this.viewMode === "table" ? 72 : 48;
          },
          markFirstLetters(list = this.verbs) {
            let previous = null;
            list.forEach((verb) => {
              verb.isFirstOfLetter = verb.letter !== previous;
              previous = verb.letter;
            });
          },
          activeVariantLabel() {
            const match = this.variantOptions.find((option) => option.value === this.variantFilter);
            return match ? match.label : "All verbs";
          },
          variantBadge(verb) {
            if (verb.variantLabel === "Multiple variants") return "Multiple spellings or pronunciations";
            if (verb.variantLabel === "Changed form") return "Past or participle differs from base";
            return "Simple past and participle reuse the base";
          },
          async copyVerb(verb) {
            const text = `${verb.base} — ${verb.simplePastForms.join(" / ")} — ${verb.pastParticipleForms.join(" / ")}`;
            try {
              await navigator.clipboard.writeText(text);
              this.showToast(`Copied "${verb.base}" family`);
            } catch (err) {
              console.error("Clipboard unavailable:", err);
              this.showToast("Copy not supported in this browser.");
            }
          },
          showToast(message) {
            const template = document.getElementById("copy-toast-template");
            if (!template) return;
            const node = template.content.firstElementChild.cloneNode(true);
            node.textContent = message;
            node.style.transition = "opacity 0.3s ease, transform 0.3s ease";
            node.style.opacity = "0";
            node.style.transform = "translateY(12px)";
            const host = document.createElement("div");
            host.className = "pointer-events-none fixed inset-x-0 bottom-8 z-50 flex justify-center";
            host.appendChild(node);
            document.body.appendChild(host);
            requestAnimationFrame(() => {
              node.style.opacity = "1";
              node.style.transform = "translateY(0)";
            });
            setTimeout(() => {
              node.style.opacity = "0";
              node.style.transform = "translateY(12px)";
              setTimeout(() => host.remove(), 300);
            }, 2200);
          },
        };
      }
    </script>
  </body>
</html>
