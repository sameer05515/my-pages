<!DOCTYPE html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comprehensive Suffix Explorer</title>
    <meta
      name="description"
      content="Browse an interactive catalog of English suffixes with searchable meanings, sample words, and quick filters using Alpine.js and Tailwind CSS."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
            },
            colors: {
              "slate-950": "#020617",
            },
            boxShadow: {
              glow: "0 0 35px rgba(14, 165, 233, 0.2)",
            },
          },
        },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>
      body {
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: rgba(148, 163, 184, 0.45);
        border-radius: 9999px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div class="relative min-h-screen overflow-x-hidden bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">
      <div class="absolute inset-x-0 top-0 -z-10 h-64 bg-gradient-to-b from-sky-500/20 via-transparent to-transparent blur-3xl"></div>
      <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
        <div x-data="suffixExplorer()" x-init="init()" class="relative space-y-12">
          <header class="space-y-6 text-center">
            <p class="inline-flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/70 px-4 py-1 text-xs font-medium uppercase tracking-[0.3em] text-slate-300">
              Updated resource
            </p>
            <h1 class="text-3xl font-semibold tracking-tight text-white sm:text-4xl md:text-5xl">Comprehensive Suffix Explorer</h1>
            <p class="mx-auto max-w-3xl text-base text-slate-300 sm:text-lg">
              Discover how English suffixes shape meaning. Filter by function, jump to any letter, compare sample words, and switch between
              card or table layouts without page reloads.
            </p>
            <div class="flex flex-wrap items-center justify-center gap-3 text-sm text-slate-400">
              <div class="flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/70 px-4 py-2">
                <span class="inline-flex h-2.5 w-2.5 rounded-full bg-sky-400"></span>
                <span x-text="`${totalSuffixes} suffixes`"></span>
              </div>
              <div class="flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/70 px-4 py-2">
                <span class="inline-flex h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
                <span x-text="`${categoryFilters.length} categories`"></span>
              </div>
              <div class="flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/70 px-4 py-2">
                <span class="inline-flex h-2.5 w-2.5 rounded-full bg-orange-400"></span>
                <span x-text="`${letters.length} quick jumps`"></span>
              </div>
            </div>
          </header>

          <section class="rounded-3xl border border-slate-800/80 bg-slate-900/70 shadow-lg shadow-sky-900/15 backdrop-blur-sm">
            <div class="grid gap-8 p-6 md:p-8 lg:grid-cols-[2fr,1fr]">
              <div class="space-y-6">
                <label class="block text-sm font-medium text-slate-300">
                  Search the list
                  <div class="relative mt-2">
                    <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-500">
                      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                      </svg>
                    </span>
                    <input
                      x-model.debounce.250ms="query"
                      type="search"
                      placeholder="Search suffixes, meanings, or sample words..."
                      class="w-full rounded-2xl border border-slate-700/70 bg-slate-900/90 py-3 pl-11 pr-4 text-base text-slate-100 placeholder:text-slate-500 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/40"
                    />
                  </div>
                </label>

                <div class="grid gap-4 sm:grid-cols-2">
                  <label class="block text-sm font-medium text-slate-300">
                    Category
                    <select
                      x-model="category"
                      class="mt-2 w-full rounded-2xl border border-slate-700/70 bg-slate-900/90 px-4 py-3 text-sm text-slate-100 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/40"
                    >
                      <option value="all">All categories</option>
                      <template x-for="option in categoryFilters" :key="option.value">
                        <option :value="option.value" x-text="`${option.label} (${option.count})`"></option>
                      </template>
                    </select>
                  </label>

                  <div class="block text-sm font-medium text-slate-300">
                    Sort order
                    <div class="mt-2 grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        @click="setSort('alpha')"
                        :class="sort === 'alpha' ? 'bg-sky-500 text-white shadow-glow' : 'bg-slate-900/90 text-slate-300 hover:bg-slate-800/80'"
                        class="rounded-2xl border border-slate-700/70 px-4 py-3 text-sm font-medium transition"
                      >
                        A → Z
                      </button>
                      <button
                        type="button"
                        @click="setSort('category')"
                        :class="sort === 'category' ? 'bg-sky-500 text-white shadow-glow' : 'bg-slate-900/90 text-slate-300 hover:bg-slate-800/80'"
                        class="rounded-2xl border border-slate-700/70 px-4 py-3 text-sm font-medium transition"
                      >
                        Category
                      </button>
                    </div>
                  </div>
                </div>

                <div class="space-y-3">
                  <span class="block text-sm font-medium text-slate-300">Quick jump</span>
                  <div class="flex flex-wrap gap-1.5">
                    <button
                      type="button"
                      @click="setLetter('all')"
                      :class="letter === 'all' ? 'bg-sky-500 text-white shadow-glow' : 'bg-slate-900/90 text-slate-200 hover:bg-slate-800/80'"
                      class="rounded-full border border-slate-700/70 px-3 py-1 text-xs font-semibold uppercase tracking-wide transition"
                    >
                      All
                    </button>
                    <template x-for="char in letters" :key="`jump-${char}`">
                      <button
                        type="button"
                        @click="setLetter(char); ensureLetterVisible(char)"
                        :disabled="!availableLetters.has(char)"
                        :class="letterButtonClass(char)"
                        class="rounded-full border border-slate-700/70 px-3 py-1 text-xs font-semibold uppercase tracking-wide transition"
                      >
                        <span x-text="char"></span>
                      </button>
                    </template>
                    <template x-if="availableLetters.has('#')">
                      <button
                        type="button"
                        @click="setLetter('#'); ensureLetterVisible('#')"
                        :class="letterButtonClass('#')"
                        class="rounded-full border border-slate-700/70 px-3 py-1 text-xs font-semibold uppercase tracking-wide transition"
                      >
                        Symbols
                      </button>
                    </template>
                  </div>
                </div>

                <div class="grid gap-3 sm:grid-cols-2">
                  <button
                    type="button"
                    @click="setView('cards')"
                    :class="viewMode === 'cards' ? 'bg-sky-500 text-white shadow-glow' : 'bg-slate-900/90 text-slate-200 hover:bg-slate-800/80'"
                    class="inline-flex items-center justify-center gap-2 rounded-2xl border border-slate-700/70 px-4 py-3 text-sm font-medium transition"
                  >
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 9h7V4H3v5Zm11 0h7V4h-7v5ZM3 20h7v-5H3v5Zm11 0h7v-5h-7v5Z" />
                    </svg>
                    Card view
                  </button>
                  <button
                    type="button"
                    @click="setView('table')"
                    :class="viewMode === 'table' ? 'bg-sky-500 text-white shadow-glow' : 'bg-slate-900/90 text-slate-200 hover:bg-slate-800/80'"
                    class="inline-flex items-center justify-center gap-2 rounded-2xl border border-slate-700/70 px-4 py-3 text-sm font-medium transition"
                  >
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h18M9 3v18m6-18v18M3 19h18M3 12h18" />
                    </svg>
                    Table view
                  </button>
                </div>
              </div>

              <div class="flex flex-col justify-between gap-6 rounded-2xl border border-slate-800/80 bg-slate-950/80 p-6 shadow-lg shadow-black/25">
                <div>
                  <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Snapshot</h2>
                  <dl class="mt-4 space-y-3 text-sm text-slate-300">
                    <div class="flex items-center justify-between rounded-xl border border-slate-800/70 bg-slate-900/80 px-4 py-3">
                      <dt>Results</dt>
                      <dd class="font-semibold text-white" x-text="filtered.length"></dd>
                    </div>
                    <div class="flex items-center justify-between rounded-xl border border-slate-800/70 bg-slate-900/80 px-4 py-3">
                      <dt>Current letter</dt>
                      <dd class="font-semibold text-white" x-text="letter === 'all' ? 'All letters' : letter"></dd>
                    </div>
                    <div class="flex items-center justify-between rounded-xl border border-slate-800/70 bg-slate-900/80 px-4 py-3">
                      <dt>Category filter</dt>
                      <dd class="font-semibold text-white" x-text="categoryLabel()"></dd>
                    </div>
                    <div class="flex items-center justify-between rounded-xl border border-slate-800/70 bg-slate-900/80 px-4 py-3">
                      <dt>Layout</dt>
                      <dd class="font-semibold text-white" x-text="viewMode === 'cards' ? 'Card view' : 'Table view'"></dd>
                    </div>
                  </dl>
                </div>
                <button
                  type="button"
                  @click="resetFilters()"
                  class="inline-flex items-center justify-center gap-2 rounded-2xl border border-slate-700/70 bg-slate-900/80 px-4 py-2 text-sm font-medium text-slate-200 transition hover:border-sky-400 hover:text-white hover:shadow-glow"
                >
                  Reset filters
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4 4 5.5 5.5M4.5 9.5H9V5" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="m20 20-5.5-5.5m5 0H15v4.5" />
                  </svg>
                </button>
              </div>
            </div>
          </section>

          <section class="relative space-y-6">
            <template x-if="loading">
              <div class="rounded-3xl border border-slate-800/80 bg-slate-900/60 p-10 text-center shadow-lg shadow-black/25">
                <div class="mx-auto flex h-12 w-12 animate-spin items-center justify-center rounded-full border-2 border-slate-700 border-t-sky-400"></div>
                <p class="mt-6 text-sm text-slate-400">Loading suffix catalog…</p>
              </div>
            </template>

            <template x-if="error">
              <div class="rounded-3xl border border-rose-900/60 bg-rose-950/50 p-8 text-center text-rose-200 shadow-lg shadow-rose-900/20">
                <h2 class="text-lg font-semibold text-rose-100">Unable to load suffixes</h2>
                <p class="mt-3 text-sm">Please confirm the data source is reachable and try again.</p>
                <button
                  type="button"
                  @click="retry()"
                  class="mt-6 inline-flex items-center gap-2 rounded-full border border-rose-500/50 bg-rose-500/20 px-5 py-2 text-sm font-medium text-rose-100 transition hover:bg-rose-500/30"
                >
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M19.071 19.071a9 9 0 1 0-14.142 0" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v3m0 0 1.5-1.5M12 18l-1.5-1.5" />
                  </svg>
                  Try again
                </button>
              </div>
            </template>

            <template x-if="!loading && !error && filtered.length === 0">
              <div class="rounded-3xl border border-slate-800/80 bg-slate-900/60 p-10 text-center shadow-lg shadow-black/25">
                <h2 class="text-lg font-semibold text-white">No matches found</h2>
                <p class="mt-3 text-sm text-slate-400">Adjust your search or filter settings to explore more suffixes.</p>
              </div>
            </template>

            <template x-if="!loading && !error && filtered.length > 0">
              <div class="space-y-6">
                <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                  <p class="text-sm text-slate-400">
                    Displaying
                    <span class="font-semibold text-slate-200" x-text="visibleSuffixes.length"></span>
                    of
                    <span class="font-semibold text-slate-200" x-text="filtered.length"></span>
                    match<span x-text="filtered.length === 1 ? '' : 'es'"></span>
                  </p>
                  <div class="flex items-center gap-2 text-xs text-slate-500">
                    <span class="inline-flex h-2.5 w-2.5 rounded-full bg-sky-400"></span>
                    <span>Click any card or row to copy the suffix with its hyphen.</span>
                  </div>
                </div>

                <template x-if="viewMode === 'cards'">
                  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                    <template x-for="suffix in visibleSuffixes" :key="suffix.id">
                      <article
                        @click="copySuffix(suffix.displaySuffix)"
                        :data-letter-anchor="suffix.isFirstOfLetter ? suffix.letter : null"
                        class="group relative flex cursor-pointer flex-col gap-4 rounded-3xl border border-slate-800/80 bg-slate-900/80 p-6 shadow-lg shadow-black/25 transition hover:border-sky-400/70 hover:bg-slate-900 hover:shadow-glow"
                      >
                        <div class="flex items-start justify-between gap-3">
                          <div>
                            <h3 class="text-xl font-semibold text-white transition group-hover:text-sky-300" x-text="suffix.displaySuffix"></h3>
                            <p class="mt-1 text-sm text-slate-400" x-text="suffix.meanings || 'Meaning coming soon.'"></p>
                          </div>
                          <span class="rounded-full border border-sky-500/40 bg-sky-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-sky-300">
                            <span x-text="suffix.primaryCategory"></span>
                          </span>
                        </div>
                        <div class="space-y-2 text-sm text-slate-300">
                          <span class="block text-xs font-medium uppercase tracking-wide text-slate-400">Examples</span>
                          <template x-if="suffix.examples.length">
                            <ul class="space-y-2 text-sm text-slate-200">
                              <template x-for="(example, index) in suffix.examples" :key="`${suffix.id}-example-${index}`">
                                <li class="flex items-start gap-2 leading-relaxed">
                                  <span class="mt-1 h-1.5 w-1.5 flex-none rounded-full bg-sky-400"></span>
                                  <span x-text="example"></span>
                                </li>
                              </template>
                            </ul>
                          </template>
                          <template x-if="!suffix.examples.length">
                            <p class="text-xs italic text-slate-500">Examples coming soon.</p>
                          </template>
                        </div>
                        <div class="mt-auto flex items-center justify-between text-xs text-slate-500">
                          <span>
                            Starts with
                            <span class="font-semibold text-slate-300" x-text="suffix.letter === '#' ? 'symbol' : suffix.letter"></span>
                          </span>
                          <span class="hidden items-center gap-1 text-slate-400 group-hover:flex">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M16 8v6a4 4 0 0 1-4 4h-6" />
                              <path stroke-linecap="round" stroke-linejoin="round" d="M8 16V10a4 4 0 0 1 4-4h6" />
                            </svg>
                            <span>Copied</span>
                          </span>
                        </div>
                      </article>
                    </template>
                  </div>
                </template>

                <template x-if="viewMode === 'table'">
                  <div class="overflow-hidden rounded-3xl border border-slate-800/80 bg-slate-900/80 shadow-lg shadow-black/25">
                    <div class="scrollbar-thin overflow-x-auto">
                      <table class="min-w-full divide-y divide-slate-800 text-left text-sm text-slate-200">
                        <thead class="bg-slate-900">
                          <tr class="text-xs uppercase tracking-wide text-slate-400">
                            <th scope="col" class="px-5 py-3 font-medium">Suffix</th>
                            <th scope="col" class="px-5 py-3 font-medium">Meanings</th>
                            <th scope="col" class="px-5 py-3 font-medium">Category</th>
                            <th scope="col" class="px-5 py-3 font-medium">Sample words</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">
                          <template x-for="suffix in visibleSuffixes" :key="`${suffix.id}-row`">
                            <tr
                              @click="copySuffix(suffix.displaySuffix)"
                              :data-letter-anchor="suffix.isFirstOfLetter ? suffix.letter : null"
                              class="cursor-pointer transition hover:bg-slate-800/80"
                            >
                              <td class="whitespace-nowrap px-5 py-4 font-semibold text-white" x-text="suffix.displaySuffix"></td>
                              <td class="max-w-sm px-5 py-4 text-slate-300" x-text="suffix.meanings || 'Meaning coming soon.'"></td>
                              <td class="whitespace-nowrap px-5 py-4">
                                <span class="inline-flex items-center rounded-full border border-sky-500/40 bg-sky-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-sky-300">
                                  <span x-text="suffix.primaryCategory"></span>
                                </span>
                              </td>
                              <td class="px-5 py-4 text-slate-200">
                                <template x-if="suffix.examples.length">
                                  <ul class="space-y-1">
                                    <template x-for="(example, idx) in suffix.examples" :key="`${suffix.id}-row-example-${idx}`">
                                      <li class="leading-relaxed" x-text="example"></li>
                                    </template>
                                  </ul>
                                </template>
                                <template x-if="!suffix.examples.length">
                                  <span class="text-xs italic text-slate-500">Examples coming soon.</span>
                                </template>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </template>

                <div class="flex justify-center">
                  <button
                    type="button"
                    @click="loadMore()"
                    x-show="visibleSuffixes.length < filtered.length"
                    class="inline-flex items-center gap-2 rounded-full border border-slate-700/70 bg-slate-900/90 px-6 py-2 text-sm font-medium text-slate-200 transition hover:border-sky-400 hover:text-white hover:shadow-glow"
                  >
                    Load more
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                  </button>
                </div>
              </div>
            </template>
          </section>
        </div>
      </div>
    </div>

    <template id="copy-toast-template">
      <div class="rounded-full border border-sky-500/40 bg-sky-500/20 px-4 py-2 text-sm font-medium text-sky-100 shadow-glow">Suffix copied</div>
    </template>

    <script>
      function suffixExplorer() {
        return {
          loading: true,
          error: null,
          suffixes: [],
          query: "",
          category: "all",
          sort: "alpha",
          letter: "all",
          viewMode: "cards",
          visibleCount: 54,
          totalSuffixes: 0,
          letters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),
          availableLetters: new Set(),
          categoryFilters: [],
          async init() {
            this.$watch("query", () => this.resetVisible());
            this.$watch("category", () => this.resetVisible());
            this.$watch("letter", () => this.resetVisible());
            this.$watch("sort", () => this.resetVisible(false));
            this.$watch("viewMode", () => this.resetVisible(false));
            await this.loadData();
          },
          async loadData() {
            this.loading = true;
            this.error = null;
            try {
              const response = await fetch("synthesized-data/word-suffixes.json");
              if (!response.ok) {
                throw new Error(`Request failed with status ${response.status}`);
              }
              const raw = await response.json();
              const transformed = raw
                .map((item, index) => this.transformSuffix(item, index))
                .filter(Boolean);
              this.suffixes = this.sortSuffixes(transformed);
              this.totalSuffixes = this.suffixes.length;
              this.availableLetters = new Set(this.suffixes.map((suffix) => suffix.letter));
              this.categoryFilters = this.buildCategoryFilters(this.suffixes);
              this.markFirstLetters();
            } catch (err) {
              console.error("Suffix load failed:", err);
              this.error = "Unable to load suffixes right now.";
            } finally {
              this.loading = false;
            }
          },
          retry() {
            this.loadData();
          },
          transformSuffix(item, index) {
            const suffix = (item.Suffix || "").trim();
            if (!suffix) return null;
            const meanings = (item.Meanings || "").replace(/\s+/g, " ").trim();
            const examples = this.extractExamples(item.SampleWordsAndDefinitions);
            const displaySuffix = suffix.startsWith("-") ? suffix : `-${suffix}`;
            const cleaned = displaySuffix.replace(/^[^a-zA-Z]+/, "");
            const letter = cleaned ? cleaned[0].toUpperCase() : "#";
            const categories = this.deriveCategories(meanings);
            const searchText = [displaySuffix, meanings, examples.join(" "), categories.join(" ")].join(" ").toLowerCase();
            return {
              id: `${displaySuffix}-${index}`,
              displaySuffix,
              meanings,
              categories,
              primaryCategory: categories[0] || "General",
              examples,
              searchText,
              letter: /^[A-Z]/.test(letter) ? letter : "#",
              isFirstOfLetter: false,
            };
          },
          extractExamples(value) {
            return (value || "")
              .split(/,\s*/)
              .map((example) => example.replace(/\s+/g, " ").trim())
              .filter((example) => example.length > 0);
          },
          deriveCategories(meanings) {
            const value = (meanings || "").toLowerCase();
            const categories = new Set();
            const tests = [
              { label: "People", match: ["person", "someone", "one who", "a person"] },
              { label: "Quality", match: ["quality", "character", "quality of"] },
              { label: "State / Condition", match: ["state", "condition", "realm"] },
              { label: "Action / Process", match: ["action", "process", "act of", "act,", "product"] },
              { label: "Verb Form", match: ["makes the word a verb", "verb", "verb form"] },
              { label: "Noun Form", match: ["makes the word a noun", "noun form", "noun"] },
              { label: "Adjective", match: ["adj.", "adjective"] },
              { label: "Adverb", match: ["adverb"] },
              { label: "Relation", match: ["relating to", "related to", "pertaining to", "of or relating to"] },
              { label: "Places", match: ["place for", "place where", "location"] },
              { label: "Tense", match: ["past tense", "tense"] },
              { label: "Medical", match: ["surgical", "blood", "medicine", "medical", "disease"] },
              { label: "Diminutive", match: ["diminutive", "small"] },
              { label: "Power / Authority", match: ["rule", "government", "power"] },
              { label: "Collective", match: ["group", "collective"] },
              { label: "Numbers", match: ["number", "count"] },
            ];
            tests.forEach((test) => {
              if (test.match.some((token) => value.includes(token))) {
                categories.add(test.label);
              }
            });
            if (categories.size === 0 && meanings) {
              categories.add("General");
            }
            return Array.from(categories);
          },
          buildCategoryFilters(list) {
            const counter = new Map();
            list.forEach((suffix) => {
              const group = suffix.categories.length ? suffix.categories : ["General"];
              group.forEach((category) => {
                counter.set(category, (counter.get(category) || 0) + 1);
              });
            });
            return Array.from(counter.entries())
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([label, count]) => ({ value: label.toLowerCase(), label, count }));
          },
          get filtered() {
            if (!this.suffixes.length) return [];
            const queryValue = this.query.trim().toLowerCase();
            const categoryValue = this.category;
            const letterValue = this.letter;
            const filteredList = this.suffixes.filter((suffix) => {
              const matchesQuery = queryValue ? suffix.searchText.includes(queryValue) : true;
              const matchesCategory =
                categoryValue === "all"
                  ? true
                  : suffix.categories.map((cat) => cat.toLowerCase()).includes(categoryValue);
              const matchesLetter = letterValue === "all" ? true : suffix.letter === letterValue;
              return matchesQuery && matchesCategory && matchesLetter;
            });
            const sorted = this.sortSuffixes(filteredList);
            this.markFirstLetters(sorted);
            return sorted;
          },
          sortSuffixes(list) {
            const comparator =
              this.sort === "category"
                ? (a, b) => a.primaryCategory.localeCompare(b.primaryCategory) || a.displaySuffix.localeCompare(b.displaySuffix)
                : (a, b) => a.displaySuffix.localeCompare(b.displaySuffix);
            return [...list].sort(comparator);
          },
          get visibleSuffixes() {
            const slice = this.filtered.slice(0, this.visibleCount);
            this.markFirstLetters(slice);
            return slice;
          },
          markFirstLetters(list = this.suffixes) {
            let previous = null;
            list.forEach((suffix) => {
              suffix.isFirstOfLetter = suffix.letter !== previous;
              previous = suffix.letter;
            });
          },
          setSort(mode) {
            this.sort = mode;
          },
          setView(mode) {
            this.viewMode = mode;
          },
          setLetter(value) {
            this.letter = value;
          },
          ensureLetterVisible(letter) {
            if (letter === "all") return;
            const index = this.filtered.findIndex((suffix) => suffix.letter === letter);
            if (index === -1) return;
            if (index >= this.visibleCount) {
              this.visibleCount = index + 24;
            }
            this.$nextTick(() => {
              const anchor = document.querySelector(`[data-letter-anchor="${letter}"]`);
              if (anchor) {
                anchor.scrollIntoView({ behavior: "smooth", block: "start" });
              }
            });
          },
          letterButtonClass(char) {
            if (!this.availableLetters.has(char)) {
              return "cursor-not-allowed border-slate-800/60 bg-slate-900/60 text-slate-600";
            }
            return this.letter === char ? "bg-sky-500 text-white shadow-glow" : "bg-slate-900/90 text-slate-200 hover:bg-slate-800/80";
          },
          resetFilters() {
            this.query = "";
            this.category = "all";
            this.letter = "all";
            this.sort = "alpha";
            this.viewMode = "cards";
            this.resetVisible();
          },
          resetVisible(resetCount = true) {
            if (resetCount) {
              this.visibleCount = this.viewMode === "table" ? 66 : 54;
            }
          },
          loadMore() {
            this.visibleCount += this.viewMode === "table" ? 66 : 54;
          },
          categoryLabel() {
            if (this.category === "all") return "All categories";
            const match = this.categoryFilters.find((option) => option.value === this.category);
            return match ? match.label : "Custom";
          },
          async copySuffix(value) {
            try {
              await navigator.clipboard.writeText(value);
              this.showToast(`Copied "${value}"`);
            } catch (err) {
              console.error("Clipboard unavailable:", err);
              this.showToast("Copy not supported in this browser.");
            }
          },
          showToast(message) {
            const template = document.getElementById("copy-toast-template");
            if (!template) return;
            const node = template.content.firstElementChild.cloneNode(true);
            node.textContent = message;
            node.style.transition = "opacity 0.3s ease, transform 0.3s ease";
            node.style.opacity = "0";
            node.style.transform = "translateY(12px)";
            const host = document.createElement("div");
            host.className = "pointer-events-none fixed inset-x-0 bottom-8 z-50 flex justify-center";
            host.appendChild(node);
            document.body.appendChild(host);
            requestAnimationFrame(() => {
              node.style.opacity = "1";
              node.style.transform = "translateY(0)";
            });
            setTimeout(() => {
              node.style.opacity = "0";
              node.style.transform = "translateY(12px)";
              setTimeout(() => host.remove(), 300);
            }, 2200);
          },
        };
      }
    </script>
  </body>
</html>
