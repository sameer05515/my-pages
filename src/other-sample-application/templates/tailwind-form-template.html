<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Form Template</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <!-- Form Card -->
    <div class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Form Title</h2>
      
      <form class="space-y-6" ng-controller="FormController">
        <!-- Text Input -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
            Name <span class="text-red-500">*</span>
          </label>
          <input 
            type="text" 
            id="name"
            name="name"
            ng-model="formData.name"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Enter your name">
          <span ng-show="errors.name" class="text-red-500 text-sm mt-1 block">
            {{errors.name}}
          </span>
        </div>

        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
            Email <span class="text-red-500">*</span>
          </label>
          <input 
            type="email" 
            id="email"
            name="email"
            ng-model="formData.email"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Enter your email">
          <span ng-show="errors.email" class="text-red-500 text-sm mt-1 block">
            {{errors.email}}
          </span>
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            Password <span class="text-red-500">*</span>
          </label>
          <input 
            type="password" 
            id="password"
            name="password"
            ng-model="formData.password"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Enter your password">
          <span ng-show="errors.password" class="text-red-500 text-sm mt-1 block">
            {{errors.password}}
          </span>
        </div>

        <!-- Select Dropdown -->
        <div>
          <label for="country" class="block text-sm font-medium text-gray-700 mb-1">
            Country
          </label>
          <select 
            id="country"
            name="country"
            ng-model="formData.country"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="">Select a country</option>
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="ca">Canada</option>
          </select>
        </div>

        <!-- Textarea -->
        <div>
          <label for="message" class="block text-sm font-medium text-gray-700 mb-1">
            Message
          </label>
          <textarea 
            id="message"
            name="message"
            ng-model="formData.message"
            rows="4"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Enter your message"></textarea>
        </div>

        <!-- Checkbox -->
        <div class="flex items-center">
          <input 
            type="checkbox" 
            id="agree"
            name="agree"
            ng-model="formData.agree"
            class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
          <label for="agree" class="ml-2 text-sm text-gray-700">
            I agree to the terms and conditions
          </label>
        </div>

        <!-- Radio Buttons -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Preferred Contact Method</label>
          <div class="space-y-2">
            <div class="flex items-center">
              <input 
                type="radio" 
                id="contact-email"
                name="contact"
                ng-model="formData.contact"
                value="email"
                class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
              <label for="contact-email" class="ml-2 text-sm text-gray-700">Email</label>
            </div>
            <div class="flex items-center">
              <input 
                type="radio" 
                id="contact-phone"
                name="contact"
                ng-model="formData.contact"
                value="phone"
                class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
              <label for="contact-phone" class="ml-2 text-sm text-gray-700">Phone</label>
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
          <button 
            type="button"
            class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500">
            Cancel
          </button>
          <button 
            type="submit"
            class="px-6 py-2 bg-blue-500 text-white rounded-lg font-semibold hover:bg-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
