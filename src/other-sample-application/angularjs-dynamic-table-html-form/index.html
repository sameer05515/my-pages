<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Introspector</title>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font Awesome -->
<link rel="stylesheet" href="../../lib/css/font-awesome-4.6.3/css/font-awesome.min.css">

<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body ng-app="myapp" ng-controller="ListController" class="bg-gray-50">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <form ng-submit="addNew(personalDetails)" class="space-y-4">
                <div class="form-group">
                    <input type="text" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           placeholder="First name" 
                           ng-model="personalDetails.fname" 
                           required>   
                </div>
                <div class="form-group">
                    <input type="text" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           placeholder="Last name" 
                           ng-model="personalDetails.lname" 
                           required>   
                </div>
                <div class="form-group">
                    <input type="email" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           placeholder="Email" 
                           ng-model="personalDetails.email" 
                           required>  
                </div>
                <div class="flex justify-end">
                    <input type="submit" 
                           value="Submit" 
                           class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors cursor-pointer">    
                </div>
            </form>
        </div>

        <div ng-hide="!personalDetails.length" class="bg-white rounded-lg shadow-md p-6">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 border border-gray-300">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                <input type="checkbox" 
                                       ng-model="selectedAll" 
                                       ng-click="checkAll()" 
                                       class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">First Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Last Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr ng-repeat="personalDetail in personalDetails track by $index" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <input type="checkbox" 
                                       ng-model="personalDetail.selected"
                                       class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{personalDetail.fname}}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{personalDetail.lname}}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{personalDetail.email}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="flex justify-end mt-4">
                <input type="button" 
                       class="px-6 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors cursor-pointer" 
                       ng-click="remove()" 
                       value="Remove">
            </div>
        </div>
    </div>

    <!-- AngularJS -->
    <script src='../../lib/js/angular-1.5.5/angular.min.js'></script>
</body>
</html>
