<!DOCTYPE html>
<html lang="en" ng-app="website">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AngularJS Animate Slider</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body ng-controller="MainCtrl" class="bg-gray-50">
    <div class="container mx-auto px-4 py-8 slider">
        <div class="relative">
            <img ng-repeat="slide in slides track by $index" 
                 class="slide slide-animation nonDraggableImage"
                 ng-swipe-right="nextSlide()" 
                 ng-swipe-left="prevSlide()" 
                 ng-hide="!isCurrentSlideIndex($index)" 
                 ng-src="{{slide.image}}">

            <a class="arrow prev absolute left-4 top-1/2 transform -translate-y-1/2 bg-gray-800 bg-opacity-50 text-white p-2 rounded-full hover:bg-opacity-75 transition-all" 
               href="#" 
               ng-click="nextSlide()"></a>
            <a class="arrow next absolute right-4 top-1/2 transform -translate-y-1/2 bg-gray-800 bg-opacity-50 text-white p-2 rounded-full hover:bg-opacity-75 transition-all" 
               href="#" 
               ng-click="prevSlide()"></a>
            <nav class="nav mt-4">
                <div class="wrapper">
                    <ul class="dots flex justify-center space-x-2">
                        <li class="dot" ng-repeat="slide in slides track by $index">
                            <a href="#" 
                               ng-class="{'bg-blue-500 text-white': isCurrentSlideIndex($index), 'bg-gray-300 text-gray-700': !isCurrentSlideIndex($index)}"
                               class="px-3 py-1 rounded-lg transition-colors"
                               ng-click="setCurrentSlideIndex($index);">{{slide.description}}</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../lib/js/jquery1.11.3/jquery-1.11.3.js"></script>
    <script src='../../lib/js/angular-1.5.5/angular.min.js'></script>
    <script src='../../lib/js/angular-1.5.5/angular-sanitize.min.js'></script>
    <script src='../../lib/js/angular-1.5.5/angular-animate.min.js'></script>
    <script src="../../lib/js/angular-1.5.5/angular-route.min.js"></script>
    <script src="../../lib/js/angular-1.5.5/angular-touch.min.js"></script>
    <script src="http://cdnjs.cloudflare.com/ajax/libs/gsap/1.10.3/TweenMax.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
