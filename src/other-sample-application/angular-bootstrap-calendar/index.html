<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angular bootstrap calendar demo</title>
    <meta name="description" content="Angular bootstrap calendar demo">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style type="text/css">
      [ng-cloak] {
        display: none;
      }
    </style>
    
    <!-- Custom Styles (keep for calendar-specific styling) -->
    <link href="../../lib/css/angular-bootstrap-colorpicker/3.0.32/css/colorpicker.min.css" rel="stylesheet">
    <link href="docs/docs.css" rel="stylesheet">
  </head>
  <body ng-app="mwl.calendar.docs" ng-controller="ExamplesCtrl as vm" ng-cloak class="bg-gray-50">

    <a href="https://github.com/mattlewis92/angular-bootstrap-calendar" class="github-corner">
      <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: fixed; top: 0; border: 0; right: 0; z-index: 100000">
        <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
        <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
        <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
      </svg>
    </a>
    <style>.github-corner:hover .octo-arm{animation:octocat-wave 560ms ease-in-out}@keyframes octocat-wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-25deg)}40%,80%{transform:rotate(10deg)}}@media (max-width:500px){.github-corner:hover .octo-arm{animation:none}.github-corner .octo-arm{animation:octocat-wave 560ms ease-in-out}}</style>

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-50">
      <div class="container mx-auto px-4">
        <div class="flex items-center justify-between h-16">
          <div>
            <a class="text-xl font-bold text-gray-800" href="#">Angular Bootstrap Calendar</a>
          </div>
          <ul class="hidden md:flex space-x-4">
            <li class="active"><a href="/" class="px-3 py-2 text-blue-600 font-medium">Examples</a></li>
            <li><a href="https://github.com/mattlewis92/angular-bootstrap-calendar#installation" class="px-3 py-2 text-gray-700 hover:text-blue-600">Installation</a></li>
            <li><a href="https://github.com/mattlewis92/angular-bootstrap-calendar#documentation" class="px-3 py-2 text-gray-700 hover:text-blue-600">Documentation</a></li>
            <li><a href="https://github.com/mattlewis92/angular-bootstrap-calendar" class="px-3 py-2 text-gray-700 hover:text-blue-600">Project on GitHub</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mx-auto px-4 pt-24 pb-8">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <!-- Sidebar -->
        <div class="lg:col-span-1">
          <div class="bg-white rounded-lg shadow-md">
            <div class="p-4 border-b border-gray-200">
              <h3 class="text-lg font-semibold text-gray-800">Examples</h3>
            </div>
            <div class="p-4">
              <ul class="space-y-2">
                <li ng-repeat="demo in vm.examples track by $index">
                  <a href="javascript:;"
                     ng-click="vm.loadExample(demo)"
                     ng-class="{'bg-blue-50 text-blue-700 border-l-4 border-blue-500': vm.activeExample.key === demo.key, 'text-gray-700 hover:bg-gray-50': vm.activeExample.key !== demo.key}"
                     class="block px-3 py-2 rounded transition-colors">
                    {{ demo.label }}
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
        
        <!-- Main Content -->
        <div class="lg:col-span-3">
          <h3 class="text-2xl font-bold text-gray-800 mb-4">{{ vm.activeExample.label }}</h3>
          <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-end mb-4">
              <button class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                      ng-click="vm.editActiveExample()">
                <i class="glyphicon glyphicon-edit"></i> Edit in Plunker
              </button>
            </div>
            <uib-tabset>
              <uib-tab heading="Demo" active="vm.showDemoTab">
                <div id="demoContainer"></div>
              </uib-tab>
              <uib-tab heading="JavaScript">
                <div hljs hljs-source="vm.activeExample.javascript" hljs-language="javascript"></div>
              </uib-tab>
              <uib-tab heading="Markup">
                <div hljs hljs-source="vm.activeExample.markup" hljs-language="html"></div>
              </uib-tab>
            </uib-tabset>
          </div>
        </div>
      </div>
    </div>

    <script type="text/ng-template" id="modalContent.html">
      <div class="bg-white rounded-lg shadow-lg">
        <div class="p-6 border-b border-gray-200">
          <h3 class="text-xl font-semibold text-gray-800">Event action occurred!</h3>
        </div>
        <div class="p-6">
          <p class="text-gray-700 mb-2">Action:</p>
          <pre class="bg-gray-100 p-4 rounded">{{ vm.action }}</pre>
          <p class="text-gray-700 mb-2 mt-4">Event:</p>
          <pre class="bg-gray-100 p-4 rounded">{{ vm.event | json }}</pre>
        </div>
        <div class="p-6 border-t border-gray-200 flex justify-end">
          <button class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors" ng-click="$close()">OK</button>
        </div>
      </div>
    </script>

    <script type="text/ng-template" id="calendarControls.html">
      <br>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="text-center">
          <div class="inline-flex rounded-lg shadow-sm">
            <button class="px-4 py-2 bg-blue-500 text-white rounded-l-lg hover:bg-blue-600 transition-colors"
                    mwl-date-modifier
                    date="vm.viewDate"
                    decrement="vm.calendarView">
              Previous
            </button>
            <button class="px-4 py-2 bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors"
                    mwl-date-modifier
                    date="vm.viewDate"
                    set-to-today>
              Today
            </button>
            <button class="px-4 py-2 bg-blue-500 text-white rounded-r-lg hover:bg-blue-600 transition-colors"
                    mwl-date-modifier
                    date="vm.viewDate"
                    increment="vm.calendarView">
              Next
            </button>
          </div>
        </div>

        <div class="text-center">
          <div class="inline-flex rounded-lg shadow-sm">
            <label class="px-4 py-2 bg-blue-500 text-white rounded-l-lg hover:bg-blue-600 transition-colors cursor-pointer" 
                   ng-model="vm.calendarView" 
                   uib-btn-radio="'year'">Year</label>
            <label class="px-4 py-2 bg-blue-500 text-white hover:bg-blue-600 transition-colors cursor-pointer" 
                   ng-model="vm.calendarView" 
                   uib-btn-radio="'month'">Month</label>
            <label class="px-4 py-2 bg-blue-500 text-white hover:bg-blue-600 transition-colors cursor-pointer" 
                   ng-model="vm.calendarView" 
                   uib-btn-radio="'week'">Week</label>
            <label class="px-4 py-2 bg-blue-500 text-white rounded-r-lg hover:bg-blue-600 transition-colors cursor-pointer" 
                   ng-model="vm.calendarView" 
                   uib-btn-radio="'day'">Day</label>
          </div>
        </div>
      </div>
      <br>
    </script>

    <!-- Scripts -->
    <script src="dist/js/angular-bootstrap-calendar.js"></script>
    <script src="../../lib/js/angular-1.5.5/angular-touch.min.js"></script>
    <script src="../../lib/js/angular-1.5.5/angular-animate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-bootstrap/2.5.6/ui-bootstrap-tpls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/oclazyload/1.1.0/ocLazyLoad.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.5.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-highlightjs/0.7.1/angular-highlightjs.min.js"></script>
    <script src="../../lib/js/rrule/rrule.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-bootstrap-colorpicker/3.0.32/js/bootstrap-colorpicker-module.min.js"></script>
    <script src="docs/docs.js"></script>
    <script src="docs/examples/helpers.js"></script>
  </body>
</html>
