<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traversing an HTML Table with JavaScript and DOM Interfaces</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        function start() {
            // get the reference for the body
            var mybody = document.getElementsByTagName("body")[0];
    
            // creates <table> and <tbody> elements
            mytable = document.createElement("table");
            mytablebody = document.createElement("tbody");
    
            // creating all cells
            for(var j = 0; j < 3; j++) {
                // creates a <tr> element
                mycurrent_row = document.createElement("tr");
    
                for(var i = 0; i < 4; i++) {
                    // creates a <td> element
                    mycurrent_cell = document.createElement("td");
                    // creates a Text Node
                    currenttext = document.createTextNode("cell is row " + j + ", column " + i);
                    // appends the Text Node we created into the cell <td>
                    mycurrent_cell.appendChild(currenttext);
                    // appends the cell <td> into the row <tr>
                    mycurrent_row.appendChild(mycurrent_cell);
                }
                // appends the row <tr> into <tbody>
                mytablebody.appendChild(mycurrent_row);
            }
    
            // appends <tbody> into <table>
            mytable.appendChild(mytablebody);
            // appends <table> into <body>
            mybody.appendChild(mytable);
            // sets the border attribute of mytable to 2;
            mytable.setAttribute("border","2");
            // Add Tailwind classes to table
            mytable.className = "min-w-full divide-y divide-gray-200 border-2 border-gray-300";
            mytablebody.className = "bg-white divide-y divide-gray-200";
            // Style table cells
            var cells = mytable.getElementsByTagName("td");
            for(var k = 0; k < cells.length; k++) {
                cells[k].className = "px-6 py-4 whitespace-nowrap text-sm text-gray-900";
            }
        }
    </script>
</head>
<body onload="start()" class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6 max-w-4xl">
            <h1 class="text-2xl font-bold mb-4 text-gray-800">Traversing an HTML Table with JavaScript and DOM Interfaces</h1>
            <p class="text-gray-700 mb-4">
                This example demonstrates how to create and populate an HTML table using JavaScript and DOM interfaces.
            </p>
            <!-- Table will be inserted here by JavaScript -->
        </div>
    </div>
</body>
</html>
