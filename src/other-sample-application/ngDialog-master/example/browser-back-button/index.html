<!doctype html>
<html lang="en" ng-app="backButtonDemo">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ngDialog demo - Browser Back Button</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href='http://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,700,400italic' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="../../css/ngDialog.css">
    <link rel="stylesheet" href="../../css/ngDialog-theme-default.css">
    <link rel="stylesheet" href="../../css/ngDialog-theme-plain.css">
    <link rel="stylesheet" href="../../css/ngDialog-custom-width.css">

    <style>
        a, button {
            font: 14px 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
            display: block;
            color: #333;
            margin-bottom: 10px;
        }

        /* The following 'important' styles are just here to show off trapFocus */
        button.ngdialog-button {
            border: solid transparent 1px !important;
        }

        button.ngdialog-button:focus {
            border: solid black 1px !important;
        }

        .ngdialog h2:focus { outline: none; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-white rounded-lg shadow-md p-6">
            <ui-view />
        </div>
    </div>

    <!-- Templates -->
    <script type="text/ng-template" id="home.html">
        <div class="text-center">
            <h1 class="text-3xl font-bold mb-4 text-gray-800">Home Page</h1>
            <h2 class="text-xl mb-6 text-gray-600">Navigate to the about page</h2>
            <button ui-sref="about" 
                    class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-semibold">
                ABOUT PAGE
            </button>
        </div>
    </script>

    <script type="text/ng-template" id="about.html">
        <div class="text-center">
            <h1 class="text-3xl font-bold mb-4 text-gray-800">About Page</h1>
            <p class="text-lg mb-6 text-gray-700">{{ text }}</p>
            <button ui-sref="home" 
                    class="px-6 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors font-semibold">
                HOME PAGE
            </button>
        </div>
    </script>

    <script type="text/ng-template" id="resolveDialog">
        <div class="p-6">
            <p class="text-lg mb-4">Sup?</p>
            <div class="ngdialog-buttons flex justify-end space-x-3">
                <button class="ngdialog-button ngdialog-button-primary px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600" 
                        ng-click="confirm()">Continue</button>
                <button class="ngdialog-button ngdialog-button-primary px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600" 
                        ng-click="closeThisDialog()">Go Back</button>
            </div>
        </div>
    </script>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.4.0/angular.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/0.2.15/angular-ui-router.min.js"></script>
    <script>window.angular || document.write('<script src="../../bower_components/angular/angular.min.js">\x3C/script>')</script>
    <script src="../../js/ngDialog.js"></script>

    <!-- App -->
    <script>
        angular.module('backButtonDemo', ['ngDialog', 'ui.router'])

        .config(function($urlMatcherFactoryProvider, $stateProvider){
            $urlMatcherFactoryProvider.strictMode(false);
            $stateProvider.state('home', 
                { 
                    url: '', 
                    templateUrl: 'home.html' 
            })
            .state('about', 
                { 
                    url: '/about', 
                    templateUrl: 'about.html', 
                    controller: 'mainController', 
                    resolve:  {
                        'RESOLVE_DATA' : function($q) {
                            var defer = $q.defer();
                            setTimeout(function() {
                                defer.resolve('the data for this page resolves after 1ms');
                            }, 1);
                            return defer.promise;
                        }
                    }
            });
        })

        .run(function($rootScope) {
            $rootScope.$on('$locationChangeSuccess', function(){
                console.log('$locationChangeSuccess event fired');
            });
            $rootScope.$on('$stateChangeSuccess', function(){
                console.log('$stateChangeSuccess event fired');
            });
        })

        .controller('mainController', function($scope, RESOLVE_DATA, ngDialog, $state){
            $scope.text = RESOLVE_DATA;

            ngDialog.openConfirm({
                template: 'resolveDialog',
                className: 'ngdialog-theme-default',
                scope: $scope,
                closeByDocument: false,
                closeByEscape: false,
                showClose: false,
                closeByNavigation: true
            }).then(function(value) {
                return value;
            }, function(reason) {
                $state.go('home');
                return reason;
            });
        });
    </script>
</body>
</html>
