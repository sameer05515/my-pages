<!doctype html>
<html lang="en" ng-app="soulPlayer">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soul Center of the Universe - Music Player</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body class="bg-gray-900 text-white">
  <header class="bg-gray-800 shadow-lg p-4 mb-4" ng-controller="NowPlayingCtrl">
    <div class="container mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <img src="/app/img/scu.png" alt="Logo" class="h-12" />
        <h1 class="text-2xl font-bold">Music Player</h1>
      </div>
      <div class="song-playing">
        <h2 ng-hide="getAlbum()" class="text-lg text-gray-300">
          Play some of that good soul music from the albums below.
        </h2>
        <div ng-show="getAlbum()">
          <audio-player song="getSong()" album="getAlbum()"></audio-player>
        </div>
      </div>
    </div>
  </header>

  <div ng-view class="container mx-auto px-4"></div>

  <!-- Scripts -->
  <script src="../../lib/js/underscore.js-1.5.1/underscore-min.js"></script>
  <script src="../../lib/js/jquery1.11.3/jquery-1.11.3.js"></script>
  <script src="lib/angular/angular.js"></script>
  <script src="js/app.js"></script>
  <script src="js/services.js"></script>
  <script src="js/controllers.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/directives.js"></script>
</body>
</html>
