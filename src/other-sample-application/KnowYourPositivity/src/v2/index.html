<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentence Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .fade-enter {
        opacity: 0;
        transform: translateY(10px);
      }
      .fade-enter-active {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.5s, transform 0.5s;
      }
    </style>
  </head>
  <body class="flex items-center justify-center h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-xl text-center">
      <h1 id="sectionName" class="text-3xl font-bold text-gray-800 mb-4">Loading...</h1>
      <p id="sentence" class="text-lg text-gray-600 fade-enter">Loading...</p>

      <div class="mt-6 flex justify-between">
        <button id="prevBtn" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400" disabled>
          Previous
        </button>
        <button id="nextBtn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Next</button>
      </div>
    </div>

    <script>
      const data = [
        { section: "Growth Mindset", sentence: "Discomfort is a signal for a force push towards growth." },
        {
          section: "Learning Journey",
          sentence: "Improvement happens when learning feels like a fun push, not a burden.",
        },
        {
          section: "Breaking Plateaus",
          sentence: "A plateau is just a sign that you need an intentional push to level up.",
        },
        { section: "Mastery Path", sentence: "Success is built through consistent mastery push, not luck." },
      ];

      let currentIndex = 0;

      function updateContent() {
        const sectionEl = document.getElementById("sectionName");
        const sentenceEl = document.getElementById("sentence");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        sectionEl.textContent = data[currentIndex].section;
        sentenceEl.textContent = data[currentIndex].sentence;

        // Trigger fade-in animation
        sentenceEl.classList.remove("fade-enter-active");
        void sentenceEl.offsetWidth; // Forces reflow
        sentenceEl.classList.add("fade-enter-active");

        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === data.length - 1;
      }

      document.getElementById("prevBtn").addEventListener("click", () => {
        if (currentIndex > 0) {
          currentIndex--;
          updateContent();
        }
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        if (currentIndex < data.length - 1) {
          currentIndex++;
          updateContent();
        }
      });

      // Initial render
      updateContent();
    </script>
  </body>
</html>
