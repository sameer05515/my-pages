<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Know Your Positivity: Home Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #000000;
      }
      .dark-mode {
        --bg-color: #212529;
        --text-color: #ffffff;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
      }
      .container-fluid {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        height: 15vh;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-bottom: 2px solid var(--text-color);
      }
      main {
        height: 75vh;
        overflow-y: auto;
        padding: 20px;
      }
      footer {
        height: 10vh;
        display: flex;
        align-items: center;
        justify-content: center;
        border-top: 2px solid var(--text-color);
      }
      .theme-toggle-btn {
        cursor: pointer;
        border: none;
        background: none;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <!-- Header -->
      <header class="d-flex align-items-center justify-content-between">
        <h1>Welcome</h1>
        <div>
          <!-- Dark/Light Toggle Button -->
          <button id="theme-toggle" class="theme-toggle-btn">
            🌞
          </button>
          <!-- About Modal Trigger -->
          <button type="button" class="btn btn-outline-primary ms-2" data-bs-toggle="modal" data-bs-target="#aboutModal">
            About
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main>
        <p>
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec vel sapien eget libero congue vehicula.
        </p>
      </main>

      <!-- Footer -->
      <footer>
        <p>&copy; 2025 KnowYourPositivity</p>
      </footer>
    </div>

    <!-- About Modal -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="aboutModalLabel">About</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p>This is a simple Bootstrap-powered Dark/Light toggle example with an About modal.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <script>
      // Dark-Light Mode Toggle
      const themeToggleBtn = document.getElementById("theme-toggle");
      const body = document.body;

      function toggleTheme() {
        body.classList.toggle("dark-mode");
        const isDarkMode = body.classList.contains("dark-mode");
        themeToggleBtn.textContent = isDarkMode ? "🌙" : "🌞";
        localStorage.setItem("theme", isDarkMode ? "dark" : "light");
      }

      // Check saved theme
      if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark-mode");
        themeToggleBtn.textContent = "🌙";
      }

      themeToggleBtn.addEventListener("click", toggleTheme);
    </script>
  </body>
</html>
