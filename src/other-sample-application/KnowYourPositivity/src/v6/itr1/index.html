<!DOCTYPE html>
<html lang="en" class="transition-colors duration-300">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class", // ✅ Enable dark mode toggling
      };
    </script>
  </head>
  <body
    class="flex items-center justify-center h-screen bg-gray-100 dark:bg-gray-800"
  >
    <div
      class="w-full h-full max-w-screen-lg max-h-screen border shadow-lg bg-white overflow-hidden flex flex-col dark:bg-gray-900 dark:text-white"
    >
      <!-- Header -->
      <header
        class="h-[15%] bg-blue-500 text-white text-center flex items-center justify-center font-bold text-lg dark:bg-gray-700"
      >
        🏃‍♂️‍➡️Know Your Positivity :To push beyond limits, using some magic
        words!! Unlock the Power Within!: Through some magical words!!🪄🪄🪄🪄🪄
      </header>

      <!-- Main Content -->
      <main
        class="h-[80%] flex items-center bg-gray-100 dark:bg-gray-800 justify-center relative"
      >
        <!-- Left Button -->
        <button
          id="prev"
          class="absolute left-5 bg-gray-300 p-2 rounded-md shadow-md hover:bg-gray-400 dark:bg-gray-700 dark:hover:bg-gray-600"
        >
          ⬅️
        </button>

        <!-- Card Container -->
        <div
          id="card-container"
          class="w-1/3 p-4 bg-white shadow-md rounded-lg flex flex-col items-center dark:bg-gray-800"
        >
          <h2 id="title" class="text-xl font-semibold"></h2>
          <p
            id="desc"
            class="text-gray-700 mt-2 h-20 overflow-y-auto px-2 dark:text-gray-300"
          ></p>
        </div>

        <!-- Right Button -->
        <button
          id="next"
          class="absolute right-5 bg-gray-300 p-2 rounded-md shadow-md hover:bg-gray-400 dark:bg-gray-700 dark:hover:bg-gray-600"
        >
          ➡️
        </button>
      </main>

      <!-- Footer -->
      <footer
        class="h-[5%] bg-blue-500 text-white text-center flex items-center justify-between px-4 dark:bg-gray-700"
      >
        <span>Thank you for being with us!</span>
        <button
          id="toggle-theme"
          class="bg-gray-300 px-3 py-1 rounded-md shadow-md text-black hover:bg-gray-400 dark:bg-gray-600 dark:text-white dark:hover:bg-gray-500"
        >
          🌙 Dark Mode
        </button>
      </footer>
    </div>

    <script type="module" src="./ui.js"></script>
  </body>
</html>
