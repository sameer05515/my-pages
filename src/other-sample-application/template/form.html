<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Template - Tailwind CSS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./form/app.css">
  
  <style type="text/css">
    @charset "UTF-8";
    [ng\:cloak],[ng-cloak],[data-ng-cloak],[x-ng-cloak],.ng-cloak,.x-ng-cloak,.ng-hide{display:none !important;}
    ng\:form{display:block;}.ng-animate-block-transitions{transition:0s all!important;-webkit-transition:0s all!important;}
  </style>
</head>

<body class="bg-gray-50 py-8">
  <div class="container mx-auto px-4 max-w-2xl">
    <form class="bg-white p-6 rounded-lg shadow-md space-y-4" role="form" ng-controller="MyCtrl1">
      <!-- Name Field -->
      <div class="mb-4">
        <label for="inputName3" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <div class="w-full md:w-2/3">
          <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                 id="inputName3" 
                 placeholder="Name" 
                 ng-model="formInfo.Name">
        </div>
        <span ng-show="nameRequired" class="text-red-500 text-sm mt-1 block"></span>
      </div>

      <!-- Email Field -->
      <div class="mb-4">
        <label for="inputEmail3" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <div class="w-full md:w-2/3">
          <input type="email" 
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                 id="inputEmail3" 
                 placeholder="Email" 
                 ng-model="formInfo.Email">
        </div>
        <span ng-show="emailRequired" class="text-red-500 text-sm mt-1 block"></span>
      </div>

      <!-- Password Field -->
      <div class="mb-4">
        <label for="inputPassword3" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="w-full md:w-2/3">
          <input type="password" 
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                 id="inputPassword3" 
                 placeholder="Password" 
                 ng-model="formInfo.Password">
        </div>
        <span ng-show="passwordRequired" class="text-red-500 text-sm mt-1 block"></span>
      </div>

      <!-- Submit Button -->
      <div class="mb-4">
        <div class="ml-0 md:ml-1/3">
          <button type="submit" 
                  ng-click="saveData()" 
                  class="px-6 py-2 bg-green-500 text-white rounded-lg font-semibold hover:bg-green-600 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
            Sign up
          </button>
        </div>
      </div>

      <!-- Form Data Display -->
      <div class="mt-4 p-3 bg-gray-100 rounded">
        <span class="text-gray-700 font-mono text-sm">{{formInfo | json}}</span>
      </div>
    </form>
  </div>

  <!-- Scripts -->
  <script src="./form/jquery.min.js"></script>
  <!-- AngularJS -->
  <script src="../../lib/js/angular-1.5.5/angular.min.js"></script>
  <script src="../../lib/js/angular-1.5.5/angular-route.min.js"></script>
  
  <script src="./form/app.js"></script>
  <script src="./form/services.js"></script>
  <script src="./form/controllers.js"></script>
  <script src="./form/filters.js"></script>
  <script src="./form/directives.js"></script>
</body>
</html>
