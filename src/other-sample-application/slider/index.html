<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AngularJS Swipe Slider Animation</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Styles -->
  <link href="mobile.css" rel="stylesheet" />
</head>

<body class="bg-gray-50">
  <div ng-controller="tabsSwipeCtrl as responsive" class="container mx-auto px-4 py-8">
    <!-- Button Group -->
    <div class="flex flex-wrap gap-2 mb-4">
      <button type="button" 
              class="px-4 py-2 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition-colors"
              ng-class="{'bg-blue-500 text-white border-blue-500': responsive.ngIncludeSelected.index == 0}"
              ng-click="responsive.selectPage(0)">First</button>
      <button type="button" 
              class="px-4 py-2 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition-colors"
              ng-class="{'bg-blue-500 text-white border-blue-500': responsive.ngIncludeSelected.index == 1}"
              ng-click="responsive.selectPage(1)">Second</button>
      <button type="button" 
              class="px-4 py-2 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition-colors"
              ng-class="{'bg-blue-500 text-white border-blue-500': responsive.ngIncludeSelected.index == 2}"
              ng-click="responsive.selectPage(2)">Third</button>
      <button type="button" 
              class="px-4 py-2 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition-colors"
              ng-class="{'bg-blue-500 text-white border-blue-500': responsive.ngIncludeSelected.index == 3}"
              ng-click="responsive.selectPage(3)">Fourth</button>
    </div>
    
    <!-- Content Area -->
    <div class="ngIncludeRelative">
      <div class="ngIncludeItem bg-white rounded-lg shadow-md p-6" 
           ng-include="responsive.ngIncludeSelected.url" 
           ng-class="{'moveToLeft': responsive.moveToLeft}">
      </div>
    </div>
  </div>

  <!-- AngularJS Scripts -->
  <script src="../../lib/js/angular-1.5.5/angular.min.js"></script>
  <script src="../../lib/js/angular-1.5.5/angular-touch.min.js"></script>
  <script src="../../lib/js/angular-1.5.5/angular-animate.min.js"></script>
  <script src="tabsSwipeCtrl.js"></script>
</body>
</html>
