<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      ::-webkit-scrollbar {
        width: 12px;
      }

      ::-webkit-scrollbar-track {
        -webkit-box-shadow: inset 0 0 6px rgb(45, 3, 142);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb {
        border-radius: 10px;
        /* background-color: #fff; */
        -webkit-box-shadow: inset 0 0 6px rgba(42, 2, 7, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid min-vh-100 bg-success p-2 text-white bg-opacity-75">
      <h1>Welcome</h1>

      <h1>My-ToDo List</h1>
      <details>
        Here we will put all our To-dos, in below format
        <pre>
        [Date]:[Status- (Open/Closed)]- Title of to-do
        
        Description (As short as possible)
        </pre>
      </details>

      <h3>My List</h3>
      <div id="my-button-groups-div"></div>
      <div id="to-do-list-div"></div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
