<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page Anime.js</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-gray-50">
<!-- partial:index.partial.html -->
<div class="dust-paarticle">
  <svg width="100%" id="dust-paarticle" height="100%" viewBox="0 0 885 455" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- SVG paths remain unchanged -->
  </svg>
</div>

<div class="container-fluid mx-auto px-4 py-8">
  <div class="flex flex-col items-center justify-center min-h-screen">
    <div class="authfy-container w-full max-w-6xl">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="authfy-panel-left bg-white rounded-lg shadow-lg p-6">
          <div class="brand-col">
            <div class="headline">
              <!-- brand-logo start -->
              <div class="brand-logo mb-4">
                <img src="https://1.bp.blogspot.com/-3he0CGCSWHA/XyqopZcixRI/AAAAAAAAVM8/Mdfk_mPQa0Ydb7IAH0Iir8F4Ge7xxF0ygCLcBGAsYHQ/s0/logo.png" width="150" alt="brand-logo">
              </div><!-- ./brand-logo -->
              <p class="text-gray-600 mb-4">Login using social media to get quick access</p>
              <!-- social login buttons start -->
              <div class="space-y-3 social-buttons">
                <a href="#" class="block w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-center">
                  <i class="fa fa-facebook"></i> <span class="hidden md:inline">Signin with facebook</span>
                </a>
                <a href="#" class="block w-full px-4 py-3 bg-blue-400 text-white rounded-lg hover:bg-blue-500 transition-colors text-center">
                  <i class="fa fa-twitter"></i> <span class="hidden md:inline">Signin with twitter</span>
                </a>
                <a href="#" class="block w-full px-4 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors text-center">
                  <i class="fa fa-google-plus"></i> <span class="hidden md:inline">Signin with google</span>
                </a>
              </div><!-- ./social-buttons -->
            </div>
          </div>
        </div>
        <div class="authfy-panel-right bg-white rounded-lg shadow-lg p-6">
          <!-- authfy-login start -->
          <div class="authfy-login">
            <!-- panel-login start -->
            <div class="authfy-panel panel-login text-center active">
              <div class="authfy-heading mb-6">
                <h3 class="auth-title text-2xl font-bold text-gray-800 mb-2">Login to your account</h3>
                <p class="text-gray-600">Don't have an account? <a class="lnk-toggler text-blue-600 hover:text-blue-800" data-panel=".panel-signup" href="#">Sign Up Free!</a></p>
              </div>
              <div class="w-full">
                <form name="loginForm" class="loginForm" action="#" method="POST">
                  <div class="form-group mb-4">
                    <input type="email" class="form-control email w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" name="username" placeholder="Email address">
                  </div>
                  <div class="form-group mb-4">
                    <div class="pwdMask">
                      <!-- Password input with mask functionality -->
                      <input type="password" class="form-control password w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" name="password" placeholder="Password">
                    </div>
                  </div>
                  <div class="form-group mb-4">
                    <button type="submit" class="btn btn-login w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-semibold">
                      Login
                    </button>
                  </div>
                </form>
              </div>
            </div>
            <!-- panel-login end -->
          </div>
          <!-- authfy-login end -->
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
